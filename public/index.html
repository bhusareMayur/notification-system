<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FCM Token Generator</title>
</head>
<body>
    <h1>Firebase Push Token Generator</h1>
    <button onclick="requestToken()">Generate Token</button>
    <p><strong>Your Token:</strong></p>
    <textarea id="tokenDisplay" rows="5" cols="50" readonly></textarea>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

        // TODO: Replace with your actual Firebase project config from Console
const firebaseConfig = {
  apiKey: "AIzaSyCyyMdToNzDlbz9zB3WeIQWvh7Y4F4Dphw",
  authDomain: "notification-system-7d353.firebaseapp.com",
  projectId: "notification-system-7d353",
  storageBucket: "notification-system-7d353.firebasestorage.app",
  messagingSenderId: "740430625978",
  appId: "1:740430625978:web:f589a57aec4430c86a9683",
  measurementId: "G-QPLKCH6X6T"
};

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

window.requestToken = async () => {
    try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            // Register the service worker manually
            const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            
            const token = await getToken(messaging, { 
                vapidKey: 'BGqBPFVVxG2VFgMjfaqkImXIp5lysl-BKkgSEOSd5OdeIenut9ZH3ksgYoJEUAfEViFWUjncLWrENarnr0N2khU',
                serviceWorkerRegistration: registration // Pass the registration here
            });
            
            document.getElementById('tokenDisplay').value = token;
        } 
    } catch (err) {
        console.error("Error retrieving token:", err);
    }
};
    </script>
</body>
</html>
